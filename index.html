<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Container Vol — Meerlanden</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #666;
      --glas:  #4fc3f7;
      --papier: #a5d6a7;
      --pbd:   #ffcc80;
      --rest:  #ef9a9a;
      --gft:   #c5e1a5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 40px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      padding: 32px 24px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .sub {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
    }

    .grid {
      width: 100%;
      max-width: 480px;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .container-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 20px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .container-btn::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      border-radius: 14px 0 0 14px;
      background: var(--accent);
      transition: width 0.15s ease;
    }

    .container-btn:active {
      transform: scale(0.97);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    }

    .container-btn:active::before {
      width: 6px;
    }

    .icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .btn-text {
      flex: 1;
    }

    .btn-name {
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.1;
    }

    .btn-desc {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: 0.05em;
    }

    .arrow {
      font-size: 18px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #f0f0f0;
      color: #0f0f0f;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 10px 20px;
      border-radius: 100px;
      white-space: nowrap;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    footer {
      margin-top: 40px;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-align: center;
      padding: 0 24px;
    }
  </style>
</head>
<body>

<header>
  <div class="label">Haarlemmermeer · 2132HE</div>
  <h1>Container<br>Vol Melding</h1>
  <div class="sub">Tap a container → mail app opens → hit send</div>
</header>

<div class="grid" id="grid"></div>

<div class="toast" id="toast">📬 Mail app opening...</div>

<footer>Meerlanden · 0297 381 717 · ma–vr 8:30–16:30</footer>

<script>
  const containers = [
    {
      id: 'glas',
      name: 'Glas',
      desc: 'Glass containers',
      icon: '🫙',
      accent: '#4fc3f7',
      subject: 'Volle glascontainer – 2132HE Hoofddorp',
      body: `Geachte Meerlanden team,

Hierbij meld ik dat de glascontainer in de buurt van postcode 2132HE (Hoofddorp) vol is en geleegd dient te worden.

Met vriendelijke groet`
    },
    {
      id: 'papier',
      name: 'Papier',
      desc: 'Paper & cardboard',
      icon: '📦',
      accent: '#a5d6a7',
      subject: 'Volle papiercontainer – 2132HE Hoofddorp',
      body: `Geachte Meerlanden team,

Hierbij meld ik dat de papiercontainer in de buurt van postcode 2132HE (Hoofddorp) vol is en geleegd dient te worden.

Met vriendelijke groet`
    },
    {
      id: 'pbd',
      name: 'PBD / PMD',
      desc: 'Plastic, blik & drinkpakken',
      icon: '♻️',
      accent: '#ffcc80',
      subject: 'Volle PBD/PMD container – 2132HE Hoofddorp',
      body: `Geachte Meerlanden team,

Hierbij meld ik dat de PBD/PMD container (plastic, blik en drinkpakken) in de buurt van postcode 2132HE (Hoofddorp) vol is en geleegd dient te worden.

Met vriendelijke groet`
    },
    {
      id: 'rest',
      name: 'Restafval',
      desc: 'Residual waste',
      icon: '🗑️',
      accent: '#ef9a9a',
      subject: 'Volle restafvalcontainer – 2132HE Hoofddorp',
      body: `Geachte Meerlanden team,

Hierbij meld ik dat de restafvalcontainer in de buurt van postcode 2132HE (Hoofddorp) vol is en geleegd dient te worden.

Met vriendelijke groet`
    },
    {
      id: 'gft',
      name: 'GFT',
      desc: 'Groente, fruit & tuinafval',
      icon: '🌿',
      accent: '#c5e1a5',
      subject: 'Volle GFT container – 2132HE Hoofddorp',
      body: `Geachte Meerlanden team,

Hierbij meld ik dat de GFT container (groente-, fruit- en tuinafval) in de buurt van postcode 2132HE (Hoofddorp) vol is en geleegd dient te worden.

Met vriendelijke groet`
    }
  ];

  const meerlandenEmail = 'pi@meerlanden.nl';
  const grid = document.getElementById('grid');
  const toast = document.getElementById('toast');

  containers.forEach(c => {
    const btn = document.createElement('a');
    btn.className = 'container-btn';
    btn.style.setProperty('--accent', c.accent);
    btn.href = '#';
    btn.innerHTML = `
      <div class="icon-wrap">${c.icon}</div>
      <div class="btn-text">
        <div class="btn-name">${c.name}</div>
        <div class="btn-desc">${c.desc}</div>
      </div>
      <div class="arrow">→</div>
    `;

    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const mailtoLink = `mailto:${meerlandenEmail}?subject=${encodeURIComponent(c.subject)}&body=${encodeURIComponent(c.body)}`;
      window.location.href = mailtoLink;

      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    });

    grid.appendChild(btn);
  });
</script>

</body>
</html>
